<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <title>ครูเอสคิว — ผู้เชี่ยวชาญ SQL</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #0b1120;
      --bg-1: #131c31;
      --bg-2: #1b2740;
      --line: #2a3852;
      --text: #e6edf7;
      --muted: #8fa3c0;
      --accent: #38bdf8;
      --accent-2: #0ea5e9;
      --code-bg: #0d1526;
      --code-kw: #7dd3fc;
      --code-str: #a5e3a0;
      --code-num: #fbbf24;
      --code-cmt: #64748b;
      --ease: cubic-bezier(.22,.9,.3,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg-0);
      color: var(--text);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; min-height: 100dvh;
      padding: 16px;
      overflow: hidden;
    }

    /* แสงพื้นหลังเคลื่อนช้า ๆ ให้หน้าจอไม่นิ่งสนิท */
    .aurora { position: fixed; inset: -30%; z-index: -1; filter: blur(90px); opacity: .5; }
    .aurora span { position: absolute; border-radius: 50%; display: block; }
    .aurora .a1 { width: 46vw; height: 46vw; background: #1d4ed8; top: 4%; left: 8%; animation: drift1 22s var(--ease) infinite alternate; }
    .aurora .a2 { width: 38vw; height: 38vw; background: #0ea5e9; bottom: 6%; right: 10%; animation: drift2 26s var(--ease) infinite alternate; }
    .aurora .a3 { width: 30vw; height: 30vw; background: #7c3aed; top: 44%; left: 52%; animation: drift1 30s var(--ease) infinite alternate-reverse; }
    @keyframes drift1 { to { transform: translate3d(9vw, 7vh, 0) scale(1.18); } }
    @keyframes drift2 { to { transform: translate3d(-11vw, -6vh, 0) scale(.85); } }

    /* ---------- หน้าต่างถามชื่อ ---------- */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100; padding: 20px;
      background: rgba(5,10,20,.72); backdrop-filter: blur(6px);
      display: flex; justify-content: center; align-items: center;
      animation: fadeIn .35s var(--ease) both;
    }
    .modal-overlay.hide { animation: fadeOut .3s var(--ease) forwards; }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    .modal {
      background: var(--bg-1); border: 1px solid var(--line); border-radius: 20px;
      padding: 32px 26px; width: min(360px, 100%); text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
      animation: popIn .5s var(--ease) both .08s;
    }
    @keyframes popIn { from { opacity: 0; transform: translateY(22px) scale(.94); } }
    .modal .logo { font-size: 42px; margin-bottom: 10px; animation: float 3.5s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-9px); } }
    .modal h2 { font-size: 21px; margin-bottom: 7px; }
    .modal p { color: var(--muted); font-size: 13.5px; margin-bottom: 20px; line-height: 1.65; }

    input, textarea, button { font-family: 'Sarabun', sans-serif; }
    .modal input, .chat-input textarea {
      width: 100%; padding: 12px 15px; background: var(--bg-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px;
      font-size: 16px; /* 16px กันไม่ให้ iOS ซูมหน้าจอตอนกดพิมพ์ */
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .modal input { margin-bottom: 15px; text-align: center; }
    .modal input:focus, .chat-input textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.16); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06121f;
      border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: transform .18s var(--ease), box-shadow .25s, opacity .2s;
      box-shadow: 0 6px 18px rgba(56,189,248,.22);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(56,189,248,.34); }
    .btn-primary:active { transform: translateY(0) scale(.97); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .modal .btn-primary { padding: 13px 24px; width: 100%; }

    /* ---------- โครงหน้าแชต ---------- */
    .chat-container {
      position: relative;
      width: 100%; max-width: 640px;
      height: min(760px, 92vh); height: min(760px, 92dvh);
      background: rgba(19,28,49,.86); backdrop-filter: blur(12px);
      border: 1px solid var(--line); border-radius: 22px;
      box-shadow: 0 26px 80px rgba(0,0,0,.5);
      display: flex; flex-direction: column; overflow: hidden;
      animation: popIn .6s var(--ease) both;
    }

    .chat-header {
      background: rgba(27,39,64,.9); border-bottom: 1px solid var(--line);
      padding: 13px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .avatar {
      width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; position: relative;
      background: linear-gradient(135deg, var(--accent), #1d4ed8); color: #06121f;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px;
    }
    .avatar::after {
      content: ""; position: absolute; inset: 0; border-radius: 12px;
      box-shadow: 0 0 0 0 rgba(56,189,248,.55); animation: pulse 2.6s infinite;
    }
    @keyframes pulse { 70%, 100% { box-shadow: 0 0 0 12px rgba(56,189,248,0); } }
    .header-info { flex: 1; min-width: 0; }
    .header-info .name { font-size: 16px; font-weight: 700; }
    .header-info .status { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    .icon-btn {
      background: none; border: 1px solid var(--line); color: var(--muted);
      width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: color .2s, border-color .2s, transform .3s var(--ease);
    }
    .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
    .icon-btn:active { transform: rotate(-180deg); }

    .chat-messages {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 18px 16px; display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    }
    .chat-messages::-webkit-scrollbar { width: 7px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
    .chat-messages::-webkit-scrollbar-thumb:hover { background: #3c4f70; }

    /* ---------- ฟองข้อความ ---------- */
    .message {
      max-width: 88%; padding: 11px 15px; border-radius: 16px;
      line-height: 1.75; font-size: 14.5px; overflow-wrap: break-word;
      animation: msgIn .45s var(--ease) both;
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(14px) scale(.97); } }
    .message.user {
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06121f;
      align-self: flex-end; border-bottom-right-radius: 5px; font-weight: 600;
    }
    .message.bot {
      background: var(--bg-1); border: 1px solid var(--line);
      align-self: flex-start; border-bottom-left-radius: 5px;
    }
    .message p { margin: 0 0 8px; }
    .message p:last-child { margin-bottom: 0; }
    .message h3, .message h4, .message h5, .message h6 { font-size: 15px; font-weight: 700; margin: 13px 0 6px; color: var(--accent); }
    .message h3:first-child, .message h4:first-child { margin-top: 0; }
    .message ul, .message ol { margin: 4px 0 8px; padding-left: 21px; }
    .message li { margin-bottom: 3px; }
    .message hr { border: none; border-top: 1px solid var(--line); margin: 13px 0; }
    .message .table-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 9px; -webkit-overflow-scrolling: touch; }
    .message table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .message th, .message td { padding: 7px 11px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .message th { background: var(--bg-2); font-weight: 600; color: var(--accent); }
    .message tbody tr { transition: background .2s; }
    .message tbody tr:hover { background: rgba(56,189,248,.06); }
    .message tbody tr:last-child td { border-bottom: none; }
    .message code.inline { font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--bg-2); color: var(--code-kw); padding: 1.5px 6px; border-radius: 5px; }

    /* ---------- บล็อกโค้ด ---------- */
    .code-block { margin: 11px 0; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--code-bg); animation: msgIn .45s var(--ease) both; }
    .code-block .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 12px; background: var(--bg-2); border-bottom: 1px solid var(--line); }
    .code-block .lang { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
    .code-block .copy {
      background: none; color: var(--muted); border: 1px solid var(--line);
      padding: 5px 11px; font-size: 11.5px; border-radius: 7px; cursor: pointer;
      min-height: 30px; transition: color .2s, border-color .2s, background .2s;
    }
    .code-block .copy:hover { color: var(--accent); border-color: var(--accent); }
    .code-block .copy.done { color: #22c55e; border-color: #22c55e; background: rgba(34,197,94,.1); }
    .code-block pre { margin: 0; padding: 13px 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .code-block code { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.75; color: var(--text); white-space: pre; }
    .kw { color: var(--code-kw); font-weight: 600; }
    .str { color: var(--code-str); }
    .num { color: var(--code-num); }
    .cmt { color: var(--code-cmt); font-style: italic; }

    /* ---------- จุดกำลังพิมพ์ ---------- */
    .typing { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .typing .bars { display: flex; gap: 4px; }
    .typing .bars i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: block; animation: bounce 1.3s infinite; }
    .typing .bars i:nth-child(2) { animation-delay: .18s; }
    .typing .bars i:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-6px); opacity: 1; } }

    /* ---------- ปุ่มคำถามแนะนำ ---------- */
    .chips {
      display: flex; gap: 7px; padding: 9px 16px 2px; flex-shrink: 0;
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--bg-2); border: 1px solid var(--line); color: var(--muted);
      font-size: 12.5px; padding: 7px 13px; border-radius: 999px; cursor: pointer;
      white-space: nowrap; flex-shrink: 0; min-height: 34px;
      transition: color .2s, border-color .2s, transform .2s var(--ease), background .2s;
      animation: chipIn .5s var(--ease) both;
    }
    @keyframes chipIn { from { opacity: 0; transform: translateY(9px); } }
    .chip:nth-child(1) { animation-delay: .30s; } .chip:nth-child(2) { animation-delay: .38s; }
    .chip:nth-child(3) { animation-delay: .46s; } .chip:nth-child(4) { animation-delay: .54s; }
    .chip:nth-child(5) { animation-delay: .62s; }
    .chip:hover { color: var(--accent); border-color: var(--accent); background: rgba(56,189,248,.08); transform: translateY(-2px); }
    .chip:active { transform: scale(.95); }

    /* ---------- ช่องพิมพ์ ---------- */
    .chat-input {
      display: flex; align-items: flex-end; gap: 9px; flex-shrink: 0;
      padding: 11px 14px calc(11px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line); background: rgba(19,28,49,.9);
    }
    .chat-input textarea { resize: none; max-height: 130px; line-height: 1.5; overflow-y: auto; }
    .chat-input .btn-primary { padding: 0 20px; height: 46px; flex-shrink: 0; }

    /* ---------- ปุ่มเลื่อนลงล่างสุด ---------- */
    .to-bottom {
      position: absolute; right: 16px; bottom: 132px; z-index: 5;
      width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
      background: var(--bg-2); border: 1px solid var(--accent); color: var(--accent);
      display: flex; align-items: center; justify-content: center; font-size: 15px;
      opacity: 0; visibility: hidden; transform: translateY(10px);
      transition: opacity .25s, transform .25s var(--ease), visibility .25s;
      box-shadow: 0 6px 20px rgba(0,0,0,.4);
    }
    .to-bottom.show { opacity: 1; visibility: visible; transform: translateY(0); }

    /* ---------- มือถือ ---------- */
    @media (max-width: 700px) {
      body { padding: 0; align-items: stretch; }
      .chat-container {
        max-width: none; width: 100%;
        height: 100vh; height: 100dvh;
        border: none; border-radius: 0; box-shadow: none; animation: none;
        padding-top: env(safe-area-inset-top);
      }
      .chat-header { padding: 11px 13px; }
      .avatar { width: 38px; height: 38px; font-size: 13px; }
      .header-info .name { font-size: 15px; }
      .chat-messages { padding: 14px 12px; gap: 12px; }
      .message { max-width: 93%; font-size: 14px; padding: 10px 13px; }
      .message th, .message td { padding: 6px 9px; font-size: 12px; }
      .code-block code { font-size: 12px; }
      .chips { padding: 8px 12px 2px; }
      .chat-input { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
      .chat-input .btn-primary { padding: 0 16px; }
      .to-bottom { bottom: 124px; right: 12px; }
      .aurora { opacity: .35; }
    }

    /* จอเล็กมาก เช่น iPhone SE */
    @media (max-width: 380px) {
      .message { max-width: 96%; }
      .chat-input .btn-primary { padding: 0 13px; font-size: 14px; }
    }

    /* เคารพการตั้งค่าผู้ใช้ที่ขอให้ลดการเคลื่อนไหว */
    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
      .chat-messages { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

  <div class="modal-overlay" id="nameModal">
    <div class="modal">
      <div class="logo">🗄️</div>
      <h2>ครูเอสคิว</h2>
      <p>ผู้เชี่ยวชาญด้าน SQL และฐานข้อมูล<br>พร้อมช่วยคุณเขียนคิวรีและเข้าใจฐานข้อมูล</p>
      <input type="text" id="nameInput" placeholder="ชื่อของคุณ..." maxlength="30">
      <button class="btn-primary" onclick="submitName()">เริ่มเรียน SQL</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">SQL</div>
      <div class="header-info">
        <div class="name" id="botChatName">ครูเอสคิว</div>
        <div class="status"><span class="dot"></span> ผู้เชี่ยวชาญ SQL &amp; ฐานข้อมูล</div>
      </div>
      <button class="icon-btn" onclick="newChat()" title="เริ่มบทสนทนาใหม่" aria-label="เริ่มบทสนทนาใหม่">↺</button>
    </div>

    <div class="chat-messages" id="messages"></div>
    <button class="to-bottom" id="toBottom" onclick="scrollToBottom()" aria-label="เลื่อนลงล่างสุด">↓</button>

    <div class="chips">
      <button class="chip" onclick="ask(this)">SELECT ใช้ยังไง</button>
      <button class="chip" onclick="ask(this)">INNER JOIN กับ LEFT JOIN ต่างกันยังไง</button>
      <button class="chip" onclick="ask(this)">PRIMARY KEY คืออะไร</button>
      <button class="chip" onclick="ask(this)">ป้องกัน SQL Injection ยังไง</button>
      <button class="chip" onclick="ask(this)">GROUP BY กับ HAVING ต่างกันตรงไหน</button>
    </div>

    <div class="chat-input">
      <textarea id="input" rows="1" placeholder="ถามเรื่อง SQL ได้เลย..." autocomplete="off"></textarea>
      <button class="btn-primary" id="sendBtn" onclick="sendMessage()">ส่ง</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const sendBtn = document.getElementById("sendBtn");
    const toBottom = document.getElementById("toBottom");
    const STORE_KEY = "chsql.session";

    // เบราว์เซอร์ถือประวัติบทสนทนาเอง เพราะฝั่งเซิร์ฟเวอร์เป็น stateless (รันบน serverless ได้)
    let history = [];
    let userName = "";
    let busy = false;

    // เรียงคำยาวไว้ก่อนคำสั้น เพื่อให้ regex จับ "INSERT INTO" ก่อน "INTO"
    const SQL_KEYWORDS = ["INSERT INTO","CREATE DATABASE","CREATE TABLE","CREATE VIEW","CREATE INDEX","DROP DATABASE","DROP TABLE","ALTER TABLE","BACKUP DATABASE","FULL OUTER JOIN","LEFT JOIN","RIGHT JOIN","INNER JOIN","OUTER JOIN","GROUP BY","ORDER BY","PRIMARY KEY","FOREIGN KEY","AUTO_INCREMENT","IS NOT NULL","IS NULL","NOT NULL","UNION ALL","SELECT","DISTINCT","VALUES","UPDATE","DELETE","REFERENCES","HAVING","BETWEEN","EXISTS","DEFAULT","UNIQUE","COALESCE","IFNULL","COUNT","UNION","WHERE","LIMIT","CHECK","INDEX","FROM","JOIN","LIKE","CASE","WHEN","THEN","ELSE","DESC","NULL","INTO","TOP","SET","AND","NOT","AVG","SUM","MIN","MAX","ASC","END","ON","AS","OR","IN"];

    const escapeHtml = t => t.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function highlightSql(code) {
      const kw = SQL_KEYWORDS.map(k => k.replace(/ /g, "\\s+")).join("|");
      // สแกนรอบเดียวแล้ว escape ระหว่างทาง จะได้ไม่ไฮไลต์ทับ HTML ที่สร้างไปแล้ว
      const re = new RegExp("(--[^\\n]*)|('[^']*')|\\b(" + kw + ")\\b|\\b(\\d+(?:\\.\\d+)?)\\b", "gi");
      let out = "", last = 0, m;
      while ((m = re.exec(code)) !== null) {
        out += escapeHtml(code.slice(last, m.index));
        const cls = m[1] ? "cmt" : m[2] ? "str" : m[3] ? "kw" : "num";
        out += '<span class="' + cls + '">' + escapeHtml(m[0]) + "</span>";
        last = m.index + m[0].length;
      }
      return out + escapeHtml(code.slice(last));
    }

    function inline(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, '<code class="inline">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderTable(rows) {
      // แถวที่ 2 ของตาราง Markdown เป็นเส้นคั่น (|---|---|) ข้ามไป
      const cells = row => row.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      return '<div class="table-wrap"><table><thead><tr>' +
        head.map(c => "<th>" + inline(c) + "</th>").join("") +
        "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>";
    }

    function renderText(text) {
      const lines = text.split("\n");
      let html = "", i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }

        if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { html += "<hr>"; i++; continue; }

        const heading = line.match(/^(#{1,4})\s+(.*)$/);
        if (heading) {
          const level = Math.min(heading[1].length + 2, 6);
          html += `<h${level}>${inline(heading[2])}</h${level}>`;
          i++; continue;
        }

        if (line.trim().startsWith("|")) {
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
          html += rows.length >= 2 ? renderTable(rows) : "<p>" + inline(rows.join("\n")) + "</p>";
          continue;
        }

        const bullet = /^\s*[-*+]\s+/, numbered = /^\s*\d+[.)]\s+/;
        if (bullet.test(line) || numbered.test(line)) {
          const ordered = numbered.test(line);
          const items = [];
          while (i < lines.length && (bullet.test(lines[i]) || numbered.test(lines[i]))) {
            items.push(lines[i].replace(bullet, "").replace(numbered, ""));
            i++;
          }
          const tag = ordered ? "ol" : "ul";
          html += `<${tag}>` + items.map(t => "<li>" + inline(t) + "</li>").join("") + `</${tag}>`;
          continue;
        }

        const para = [];
        while (i < lines.length && lines[i].trim() &&
               !lines[i].trim().startsWith("|") && !/^#{1,4}\s/.test(lines[i]) &&
               !bullet.test(lines[i]) && !numbered.test(lines[i]) &&
               !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) {
          para.push(lines[i]); i++;
        }
        html += "<p>" + para.map(inline).join("<br>") + "</p>";
      }
      return html;
    }

    function renderMarkdown(text) {
      // แยกบล็อกโค้ด ```...``` ออกจากข้อความปกติ แล้วเรนเดอร์คนละแบบ
      return text.split("```").map((part, i) => {
        if (i % 2 === 1) {
          const body = part.replace(/^[a-zA-Z]*\n?/, "").replace(/\n+$/, "");
          return '<div class="code-block">' +
                 '<div class="bar"><span class="lang">sql</span>' +
                 '<button class="copy" onclick="copyCode(this)">คัดลอก</button></div>' +
                 "<pre><code>" + highlightSql(body) + "</code></pre></div>";
        }
        return renderText(part);
      }).join("");
    }

    function copyCode(btn) {
      const code = btn.closest(".code-block").querySelector("code").innerText;
      navigator.clipboard.writeText(code);
      btn.textContent = "คัดลอกแล้ว ✓";
      btn.classList.add("done");
      setTimeout(() => { btn.textContent = "คัดลอก"; btn.classList.remove("done"); }, 1600);
    }

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "message " + sender;
      if (sender === "bot") div.innerHTML = renderMarkdown(text);
      else div.textContent = text;
      messages.appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    // ปุ่มลูกศรลงจะโผล่เฉพาะตอนเลื่อนขึ้นไปอ่านข้อความเก่า
    messages.addEventListener("scroll", () => {
      const far = messages.scrollHeight - messages.scrollTop - messages.clientHeight > 160;
      toBottom.classList.toggle("show", far);
    });

    /* ---------- จำบทสนทนาไว้ กันเผลอรีเฟรชแล้วหาย ---------- */
    function saveSession() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ name: userName, history }));
      } catch (e) { /* โหมดส่วนตัวหรือปิด storage ไว้ — ข้ามไป ไม่ใช่เรื่องคอขาดบาดตาย */ }
    }

    function loadSession() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (!saved || !saved.name || !Array.isArray(saved.history) || !saved.history.length) return false;
        userName = saved.name;
        history = saved.history;
        document.getElementById("nameModal").style.display = "none";
        history.forEach(m => addMessage(m.content, m.role === "user" ? "user" : "bot"));
        return true;
      } catch (e) { return false; }
    }

    function newChat() {
      history = [];
      messages.innerHTML = "";
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      greet();
    }

    function greet() {
      addMessage("สวัสดีครับคุณ" + userName + " 👋 ผมเป็นผู้เชี่ยวชาญด้าน SQL และฐานข้อมูลครับ\n\nถามได้ทุกเรื่อง ตั้งแต่คำสั่งพื้นฐานอย่าง SELECT / WHERE ไปจนถึง JOIN, GROUP BY, การออกแบบตาราง และการป้องกัน SQL Injection\n\nหรือจะโยนโจทย์มาให้ผมเขียนคิวรีให้ก็ได้ครับ", "bot");
    }

    /* ---------- ช่องพิมพ์ยืดตามข้อความ ---------- */
    function autoGrow() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 130) + "px";
    }
    input.addEventListener("input", autoGrow);

    // Enter = ส่ง, Shift+Enter = ขึ้นบรรทัดใหม่ (บนมือถือให้ Enter ขึ้นบรรทัดใหม่ตามปกติ)
    const isTouch = matchMedia("(hover: none)").matches;
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey && !isTouch) { e.preventDefault(); sendMessage(); }
    });
    document.getElementById("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") submitName(); });

    function submitName() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name) return;
      userName = name;
      history = [];
      const modal = document.getElementById("nameModal");
      modal.classList.add("hide");
      setTimeout(() => { modal.style.display = "none"; }, 300);
      greet();
      if (!isTouch) input.focus();
    }

    function ask(btn) {
      input.value = btn.textContent;
      autoGrow();
      sendMessage();
    }

    async function sendMessage() {
      if (busy) return;
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      autoGrow();
      busy = true;
      sendBtn.disabled = true;

      const typing = document.createElement("div");
      typing.className = "message bot typing";
      typing.innerHTML = '<span class="bars"><i></i><i></i><i></i></span><span>กำลังค้นคลังความรู้ SQL...</span>';
      messages.appendChild(typing);
      scrollToBottom();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history, name: userName })
        });
        const data = await res.json();
        typing.remove();
        if (data.reply) {
          history.push({ role: "user", content: text });
          history.push({ role: "assistant", content: data.reply });
          history = history.slice(-30);  // ให้ตรงกับ MAX_HISTORY ฝั่งเซิร์ฟเวอร์
          saveSession();
        }
        addMessage(data.reply || data.error || "ขออภัยครับ เกิดข้อผิดพลาด ลองใหม่อีกครั้งนะครับ", "bot");
      } catch (err) {
        typing.remove();
        addMessage("เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จครับ ลองใหม่อีกครั้งนะครับ", "bot");
      } finally {
        busy = false;
        sendBtn.disabled = false;
      }
    }

    loadSession();
  </script>
</body>
</html>
