<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ครูเอสคิว — ผู้เชี่ยวชาญ SQL</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #0b1120;
      --bg-1: #131c31;
      --bg-2: #1b2740;
      --line: #2a3852;
      --text: #e6edf7;
      --muted: #8fa3c0;
      --accent: #38bdf8;
      --accent-2: #0ea5e9;
      --code-bg: #0d1526;
      --code-kw: #7dd3fc;
      --code-str: #a5e3a0;
      --code-num: #fbbf24;
      --code-cmt: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, var(--bg-0) 55%);
      color: var(--text);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 16px;
    }

    .modal-overlay { position: fixed; inset: 0; background: rgba(5,10,20,0.72); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal { background: var(--bg-1); border: 1px solid var(--line); border-radius: 16px; padding: 30px 26px; width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .modal .logo { font-size: 30px; margin-bottom: 10px; }
    .modal h2 { font-size: 19px; margin-bottom: 6px; }
    .modal p { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; line-height: 1.6; }
    .modal input, .chat-input input {
      width: 100%; padding: 11px 15px; background: var(--bg-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; font-size: 14.5px; outline: none;
      font-family: 'Sarabun', sans-serif;
    }
    .modal input { margin-bottom: 14px; }
    .modal input:focus, .chat-input input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,0.14); }
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06121f;
      border: none; border-radius: 10px; font-size: 14.5px; font-weight: 600; cursor: pointer;
      font-family: 'Sarabun', sans-serif;
    }
    .modal button { padding: 11px 24px; width: 100%; }
    button:hover { filter: brightness(1.08); }

    .chat-container {
      width: 100%; max-width: 620px; height: min(720px, 92vh);
      background: var(--bg-1); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.45);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-header { background: var(--bg-2); border-bottom: 1px solid var(--line); padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), #1d4ed8); color: #06121f;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 15px;
    }
    .header-info .name { font-size: 16px; font-weight: 700; }
    .header-info .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; background: var(--bg-0); }
    .chat-messages::-webkit-scrollbar { width: 8px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

    .message { max-width: 88%; padding: 11px 15px; border-radius: 14px; line-height: 1.75; font-size: 14.5px; overflow-wrap: break-word; }
    .message.user { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06121f; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 600; }
    .message.bot { background: var(--bg-1); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
    .message p { margin: 0 0 8px; }
    .message p:last-child { margin-bottom: 0; }
    .message h3, .message h4, .message h5, .message h6 { font-size: 15px; font-weight: 700; margin: 12px 0 6px; color: var(--accent); }
    .message h3:first-child, .message h4:first-child { margin-top: 0; }
    .message ul, .message ol { margin: 4px 0 8px; padding-left: 22px; }
    .message li { margin-bottom: 3px; }
    .message hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
    .message .table-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; }
    .message table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .message th, .message td { padding: 7px 11px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .message th { background: var(--bg-2); font-weight: 600; color: var(--accent); }
    .message tbody tr:last-child td { border-bottom: none; }
    .message code.inline { font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--bg-2); color: var(--code-kw); padding: 1.5px 6px; border-radius: 5px; }

    .code-block { margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
    .code-block .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--bg-2); border-bottom: 1px solid var(--line); }
    .code-block .lang { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .code-block .copy { background: none; color: var(--muted); border: 1px solid var(--line); padding: 3px 9px; font-size: 11px; border-radius: 6px; }
    .code-block .copy:hover { color: var(--accent); border-color: var(--accent); filter: none; }
    .code-block pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
    .code-block code { font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.7; color: var(--text); white-space: pre; }
    .kw { color: var(--code-kw); font-weight: 600; }
    .str { color: var(--code-str); }
    .num { color: var(--code-num); }
    .cmt { color: var(--code-cmt); font-style: italic; }

    .typing { color: var(--muted); font-style: italic; font-size: 13.5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 10px 18px 0; background: var(--bg-0); }
    .chip { background: var(--bg-2); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; padding: 5px 11px; border-radius: 999px; cursor: pointer; font-family: 'Sarabun', sans-serif; font-weight: 400; }
    .chip:hover { color: var(--accent); border-color: var(--accent); filter: none; }

    .chat-input { display: flex; padding: 12px 14px; border-top: 1px solid var(--line); gap: 9px; background: var(--bg-1); }
    .chat-input button { padding: 11px 20px; }
  </style>
</head>
<body>

  <div class="modal-overlay" id="nameModal">
    <div class="modal">
      <div class="logo">🗄️</div>
      <h2>ครูเอสคิว</h2>
      <p>ผู้เชี่ยวชาญด้าน SQL และฐานข้อมูล<br>พร้อมช่วยคุณเขียนคิวรีและเข้าใจฐานข้อมูล</p>
      <input type="text" id="nameInput" placeholder="ชื่อของคุณ..." maxlength="30">
      <button onclick="submitName()">เริ่มเรียน SQL</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">SQL</div>
      <div class="header-info">
        <div class="name" id="botChatName">ครูเอสคิว</div>
        <div class="status"><span class="dot"></span> ผู้เชี่ยวชาญ SQL &amp; ฐานข้อมูล</div>
      </div>
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="chips">
      <button class="chip" onclick="ask(this)">SELECT ใช้ยังไง</button>
      <button class="chip" onclick="ask(this)">INNER JOIN กับ LEFT JOIN ต่างกันยังไง</button>
      <button class="chip" onclick="ask(this)">PRIMARY KEY คืออะไร</button>
      <button class="chip" onclick="ask(this)">ป้องกัน SQL Injection ยังไง</button>
      <button class="chip" onclick="ask(this)">GROUP BY กับ HAVING ต่างกันตรงไหน</button>
    </div>
    <div class="chat-input">
      <input type="text" id="input" placeholder="ถามเรื่อง SQL ได้เลย..." autocomplete="off">
      <button onclick="sendMessage()">ส่ง</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    // เรียงคำยาวไว้ก่อนคำสั้น เพื่อให้ regex จับ "INSERT INTO" ก่อน "INTO"
    const SQL_KEYWORDS = ["INSERT INTO","CREATE DATABASE","CREATE TABLE","CREATE VIEW","CREATE INDEX","DROP DATABASE","DROP TABLE","ALTER TABLE","BACKUP DATABASE","FULL OUTER JOIN","LEFT JOIN","RIGHT JOIN","INNER JOIN","OUTER JOIN","GROUP BY","ORDER BY","PRIMARY KEY","FOREIGN KEY","AUTO_INCREMENT","IS NOT NULL","IS NULL","NOT NULL","UNION ALL","SELECT","DISTINCT","VALUES","UPDATE","DELETE","REFERENCES","HAVING","BETWEEN","EXISTS","DEFAULT","UNIQUE","COALESCE","IFNULL","COUNT","UNION","WHERE","LIMIT","CHECK","INDEX","FROM","JOIN","LIKE","CASE","WHEN","THEN","ELSE","DESC","NULL","INTO","TOP","SET","AND","NOT","AVG","SUM","MIN","MAX","ASC","END","ON","AS","OR","IN"];

    const escapeHtml = t => t.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function highlightSql(code) {
      const kw = SQL_KEYWORDS.map(k => k.replace(/ /g, "\\s+")).join("|");
      // สแกนรอบเดียวแล้ว escape ระหว่างทาง จะได้ไม่ไฮไลต์ทับ HTML ที่สร้างไปแล้ว
      const re = new RegExp("(--[^\\n]*)|('[^']*')|\\b(" + kw + ")\\b|\\b(\\d+(?:\\.\\d+)?)\\b", "gi");
      let out = "", last = 0, m;
      while ((m = re.exec(code)) !== null) {
        out += escapeHtml(code.slice(last, m.index));
        const cls = m[1] ? "cmt" : m[2] ? "str" : m[3] ? "kw" : "num";
        out += '<span class="' + cls + '">' + escapeHtml(m[0]) + "</span>";
        last = m.index + m[0].length;
      }
      return out + escapeHtml(code.slice(last));
    }

    function inline(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, '<code class="inline">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderTable(rows) {
      // แถวที่ 2 ของตาราง Markdown เป็นเส้นคั่น (|---|---|) ข้ามไป
      const cells = row => row.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      return '<div class="table-wrap"><table><thead><tr>' +
        head.map(c => "<th>" + inline(c) + "</th>").join("") +
        "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>";
    }

    function renderText(text) {
      const lines = text.split("\n");
      let html = "", i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }

        if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { html += "<hr>"; i++; continue; }

        const heading = line.match(/^(#{1,4})\s+(.*)$/);
        if (heading) {
          const level = Math.min(heading[1].length + 2, 6);
          html += `<h${level}>${inline(heading[2])}</h${level}>`;
          i++; continue;
        }

        if (line.trim().startsWith("|")) {
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
          html += rows.length >= 2 ? renderTable(rows) : "<p>" + inline(rows.join("\n")) + "</p>";
          continue;
        }

        const bullet = /^\s*[-*+]\s+/, numbered = /^\s*\d+[.)]\s+/;
        if (bullet.test(line) || numbered.test(line)) {
          const ordered = numbered.test(line);
          const items = [];
          while (i < lines.length && (bullet.test(lines[i]) || numbered.test(lines[i]))) {
            items.push(lines[i].replace(bullet, "").replace(numbered, ""));
            i++;
          }
          const tag = ordered ? "ol" : "ul";
          html += `<${tag}>` + items.map(t => "<li>" + inline(t) + "</li>").join("") + `</${tag}>`;
          continue;
        }

        const para = [];
        while (i < lines.length && lines[i].trim() &&
               !lines[i].trim().startsWith("|") && !/^#{1,4}\s/.test(lines[i]) &&
               !bullet.test(lines[i]) && !numbered.test(lines[i]) &&
               !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) {
          para.push(lines[i]); i++;
        }
        html += "<p>" + para.map(inline).join("<br>") + "</p>";
      }
      return html;
    }

    function renderMarkdown(text) {
      // แยกบล็อกโค้ด ```...``` ออกจากข้อความปกติ แล้วเรนเดอร์คนละแบบ
      return text.split("```").map((part, i) => {
        if (i % 2 === 1) {
          const body = part.replace(/^[a-zA-Z]*\n?/, "").replace(/\n+$/, "");
          return '<div class="code-block">' +
                 '<div class="bar"><span class="lang">sql</span>' +
                 '<button class="copy" onclick="copyCode(this)">คัดลอก</button></div>' +
                 "<pre><code>" + highlightSql(body) + "</code></pre></div>";
        }
        return renderText(part);
      }).join("");
    }

    function copyCode(btn) {
      const code = btn.closest(".code-block").querySelector("code").innerText;
      navigator.clipboard.writeText(code);
      btn.textContent = "คัดลอกแล้ว";
      setTimeout(() => { btn.textContent = "คัดลอก"; }, 1500);
    }

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "message " + sender;
      if (sender === "bot") div.innerHTML = renderMarkdown(text);
      else div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
    document.getElementById("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") submitName(); });

    async function submitName() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name) return;
      await fetch("/set_name", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      document.getElementById("nameModal").style.display = "none";
      addMessage("สวัสดีครับคุณ" + name + " 👋 ผมเป็นผู้เชี่ยวชาญด้าน SQL และฐานข้อมูลครับ\n\nถามได้ทุกเรื่อง ตั้งแต่คำสั่งพื้นฐานอย่าง SELECT / WHERE ไปจนถึง JOIN, GROUP BY, การออกแบบตาราง และการป้องกัน SQL Injection\n\nหรือจะโยนโจทย์มาให้ผมเขียนคิวรีให้ก็ได้ครับ", "bot");
      input.focus();
    }

    function ask(btn) {
      input.value = btn.textContent;
      sendMessage();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";

      const typing = document.createElement("div");
      typing.className = "message bot typing";
      typing.textContent = "กำลังค้นคลังความรู้ SQL...";
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        typing.remove();
        addMessage(data.reply || data.error || "ขออภัยครับ เกิดข้อผิดพลาด ลองใหม่อีกครั้งนะครับ", "bot");
      } catch (err) {
        typing.remove();
        addMessage("เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จครับ ลองใหม่อีกครั้งนะครับ", "bot");
      }
    }
  </script>
</body>
</html>
