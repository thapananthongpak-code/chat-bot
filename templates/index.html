<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>ครูเอสคิว — ผู้เชี่ยวชาญ SQL</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* ---------- โทนสีขาวดำมินิมอล ---------- */
    :root {
      --bg: #ffffff;
      --surface: #f6f6f6;
      --surface-2: #ededed;
      --fg: #121212;
      --muted: #6e6e6e;
      --line: #e3e3e3;
      --code-bg: #f4f4f4;
      --ease: cubic-bezier(.2,.8,.3,1);
      --sidebar: 268px;
    }
    :root[data-theme="dark"] {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1f1f1f;
      --fg: #ededed;
      --muted: #999999;
      --line: #262626;
      --code-bg: #131313;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }
    body {
      font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      display: flex; overflow: hidden;
      font-size: 15px; line-height: 1.7;
    }

    /* ---------- แถบข้าง ---------- */
    .sidebar {
      width: var(--sidebar); flex-shrink: 0; height: 100dvh;
      background: var(--surface); border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
    }
    .brand { padding: 16px 14px 10px; display: flex; align-items: center; gap: 9px; }
    .brand .mark {
      width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0;
      background: var(--fg); color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
    }
    .brand .t { font-size: 14.5px; font-weight: 600; }

    .side-actions { padding: 0 10px 10px; display: flex; gap: 7px; }
    .btn {
      font-family: inherit; font-size: 13.5px; cursor: pointer;
      background: none; color: var(--fg); border: 1px solid var(--line);
      border-radius: 9px; padding: 9px 12px;
      transition: background .16s, border-color .16s, opacity .16s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn:hover { background: var(--surface-2); }
    .btn:active { opacity: .6; }
    .btn.block { flex: 1; }
    .btn.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 500; }
    .btn.solid:hover { opacity: .85; background: var(--fg); }
    .btn.icon { padding: 0; width: 38px; height: 38px; flex-shrink: 0; }
    .btn:disabled { opacity: .35; cursor: not-allowed; }

    .side-label { padding: 8px 16px 6px; font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
    .chat-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    .chat-list::-webkit-scrollbar { width: 6px; }
    .chat-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
    .side-empty { color: var(--muted); font-size: 12.5px; padding: 14px 8px; line-height: 1.7; }

    .row {
      display: flex; align-items: center; gap: 4px; padding: 8px 10px;
      border-radius: 9px; cursor: pointer; margin-bottom: 2px;
      transition: background .16s;
    }
    .row:hover, .row.active { background: var(--surface-2); }
    .row .info { flex: 1; min-width: 0; }
    .row .t { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .m { font-size: 11px; color: var(--muted); }
    .row .del {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 16px; padding: 2px 6px; border-radius: 6px; opacity: 0;
      transition: opacity .16s, color .16s;
    }
    .row:hover .del, .row.active .del { opacity: 1; }
    .row .del:hover { color: var(--fg); background: var(--bg); }

    .side-foot {
      border-top: 1px solid var(--line);
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      display: flex; gap: 7px; align-items: center;
    }
    .side-foot .who { flex: 1; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---------- พื้นที่สนทนา ---------- */
    .main { flex: 1; min-width: 0; height: 100dvh; display: flex; flex-direction: column; }
    .topbar {
      flex-shrink: 0; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      padding-top: calc(8px + env(safe-area-inset-top));
    }
    .topbar .title { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu-btn { display: none; }

    .stream { flex: 1; overflow-y: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .stream::-webkit-scrollbar { width: 8px; }
    .stream::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
    .inner { max-width: 760px; margin: 0 auto; padding: 26px 22px 40px; }

    .turn { margin-bottom: 26px; animation: rise .32s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    .turn.user { display: flex; justify-content: flex-end; }
    .turn.user .body {
      background: var(--surface-2); border-radius: 16px 16px 4px 16px;
      padding: 10px 15px; max-width: 78%; white-space: pre-wrap;
    }
    .turn.bot .who { font-size: 11.5px; color: var(--muted); margin-bottom: 7px; letter-spacing: .04em; }

    /* ---------- เนื้อหาคำตอบ ---------- */
    .body p { margin: 0 0 11px; }
    .body p:last-child { margin-bottom: 0; }
    .body h3, .body h4, .body h5, .body h6 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; }
    .body h3:first-child, .body h4:first-child { margin-top: 0; }
    .body ul, .body ol { margin: 0 0 11px; padding-left: 20px; }
    .body li { margin-bottom: 4px; }
    .body hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
    .body strong { font-weight: 600; }
    .table-wrap { overflow-x: auto; margin: 13px 0; border: 1px solid var(--line); border-radius: 10px; }
    table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { background: var(--surface); font-weight: 600; }
    tbody tr:last-child td { border-bottom: none; }
    code.inline { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; background: var(--surface-2); padding: 2px 6px; border-radius: 5px; }

    .code-block { margin: 13px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
    .code-block .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 13px; border-bottom: 1px solid var(--line); }
    .code-block .lang { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); letter-spacing: .1em; }
    .code-block .copy { background: none; border: none; color: var(--muted); font-family: inherit; font-size: 12px; cursor: pointer; padding: 5px 9px; border-radius: 6px; }
    .code-block .copy:hover { color: var(--fg); background: var(--surface-2); }
    .code-block pre { margin: 0; padding: 13px; overflow-x: auto; }
    .code-block code { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.75; white-space: pre; }
    /* ไฮไลต์แบบขาวดำ ใช้น้ำหนักกับความจางแทนสี */
    .kw { font-weight: 600; }
    .str, .num { opacity: .72; }
    .cmt { opacity: .45; font-style: italic; }

    .turn-tools { display: flex; gap: 2px; margin-top: 8px; opacity: 0; transition: opacity .16s; }
    .turn.bot:hover .turn-tools, .turn-tools.show { opacity: 1; }
    .tool {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-family: inherit; font-size: 12px; padding: 4px 9px; border-radius: 7px;
      transition: color .16s, background .16s;
    }
    .tool:hover { color: var(--fg); background: var(--surface-2); }
    .caret {
      display: inline-block; width: 7px; height: 15px; vertical-align: -2px;
      background: var(--fg); margin-left: 2px; animation: caret .9s steps(2) infinite;
    }
    @keyframes caret { 50% { opacity: 0; } }

    .typing { display: flex; gap: 5px; align-items: center; height: 22px; }
    .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); display: block; animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .18s; }
    .typing i:nth-child(3) { animation-delay: .36s; }
    @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

    /* ---------- ปุ่มคำถามแนะนำ ---------- */
    .starters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .starter {
      font-family: inherit; font-size: 13px; cursor: pointer; text-align: left;
      background: none; border: 1px solid var(--line); color: var(--fg);
      border-radius: 999px; padding: 8px 14px; transition: background .16s;
    }
    .starter:hover { background: var(--surface-2); }

    /* ---------- ช่องพิมพ์ ---------- */
    .composer-wrap { flex-shrink: 0; padding: 0 22px calc(16px + env(safe-area-inset-bottom)); }
    .composer {
      max-width: 760px; margin: 0 auto;
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: 7px 7px 7px 15px;
      transition: border-color .16s;
    }
    .composer:focus-within { border-color: var(--muted); }
    .composer textarea {
      flex: 1; resize: none; border: none; outline: none; background: none;
      color: var(--fg); font-family: inherit; line-height: 1.6;
      font-size: 16px; /* 16px กันไม่ให้ iOS ซูมหน้าจอตอนกดพิมพ์ */
      max-height: 180px; padding: 8px 0;
    }
    .composer textarea::placeholder { color: var(--muted); }
    .send { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; font-size: 15px; padding: 0; }
    .hint { max-width: 760px; margin: 7px auto 0; font-size: 11.5px; color: var(--muted); text-align: center; }

    .scrim { display: none; }

    /* ---------- มือถือ ---------- */
    @media (max-width: 820px) {
      .menu-btn { display: flex; }
      .sidebar {
        position: fixed; inset: 0 auto 0 0; z-index: 40;
        transform: translateX(-101%); transition: transform .26s var(--ease);
        box-shadow: 0 0 40px rgba(0,0,0,.25);
      }
      .sidebar.open { transform: translateX(0); }
      .scrim {
        display: block; position: fixed; inset: 0; z-index: 30;
        background: rgba(0,0,0,.42); opacity: 0; visibility: hidden;
        transition: opacity .26s, visibility .26s;
      }
      .scrim.show { opacity: 1; visibility: visible; }
      .inner { padding: 20px 15px 32px; }
      .turn.user .body { max-width: 88%; }
      .composer-wrap { padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
      th, td { padding: 7px 10px; font-size: 12.5px; }
      .hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
      .stream { scroll-behavior: auto; }
    }
    .topbar { backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); }
    .composer { box-shadow: 0 12px 40px #00000018; transition: box-shadow .2s, transform .2s; }
    .composer:focus-within { box-shadow: 0 0 0 2px #8885, 0 12px 40px #00000018; }
    .turn { animation: arrive .22s ease-out; }
    .turn-tools { opacity: 1; }
    .body { overflow-wrap: anywhere; }
    .body a { color: inherit; text-underline-offset: 4px; }
    .source-badge { font-size: 11px; border: 1px solid var(--line); padding: 5px 10px; border-radius: 20px; white-space: nowrap; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid #999; outline-offset: 3px; }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    @media (max-width: 600px) { .source-badge { display: none; } .tool { min-height: 44px; } }
    .turn.user { animation:send-arrive .3s ease-out; }
    .typing { align-items:center; gap:6px; }
    .search-label { font-size:13px; margin-right:10px; opacity:.7; }
    @keyframes send-arrive { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
    @media(prefers-reduced-motion:reduce) { .turn.user { animation:none; } }

    /* ---------- ขนาดตัวอักษรที่ผู้ใช้ปรับได้ ---------- */
    .inner { --fs: 15px; }
    .turn .body { font-size: var(--fs); }

    /* ---------- ระหว่างพิมพ์คำตอบ: แถบความคืบหน้า + ปุ่มข้าม ---------- */
    .typebar { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .typebar .track { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .typebar .fill { height: 100%; width: 0; background: var(--fg); transition: width .12s linear; }
    .typebar .tool { padding: 2px 8px; }
    .turn.bot.typing-now .body { cursor: pointer; }

    /* คำที่ผู้ใช้ถาม ไฮไลต์ในคำตอบ */
    mark.hit { background: none; color: inherit; box-shadow: inset 0 -.42em 0 var(--surface-2); border-radius: 2px; }

    .turn-tools { align-items: center; flex-wrap: wrap; }
    .turn-tools .meta { font-size: 11.5px; color: var(--muted); padding: 4px 9px; }
    .tool.on { color: var(--fg); background: var(--surface-2); }

    /* ปุ่มกลับไปล่างสุด */
    .main { position: relative; }
    .jump {
      position: absolute; left: 50%; bottom: 112px; z-index: 5;
      width: 36px; height: 36px; border-radius: 50%; padding: 0;
      background: var(--bg); box-shadow: 0 6px 20px #0000001f;
      opacity: 0; pointer-events: none; transform: translate(-50%, 8px);
      transition: opacity .2s, transform .2s var(--ease);
    }
    .jump.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }

    /* ข้อความแจ้งสั้น ๆ */
    .toast {
      position: fixed; left: 50%; bottom: 28px; z-index: 60;
      background: var(--fg); color: var(--bg); font-size: 13px;
      padding: 8px 16px; border-radius: 999px;
      opacity: 0; transform: translate(-50%, 10px); pointer-events: none;
      transition: opacity .2s, transform .2s var(--ease);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .fs-group { display: flex; gap: 4px; }
    .fs-group .btn.icon { font-size: 12.5px; font-weight: 600; }
    .welcome-sub { color: var(--muted); font-size: 13px; }
    @media (max-width: 600px) { .fs-group { display: none; } .jump { bottom: 96px; } }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="mark">SQL</div><div class="t">ครูเอสคิว</div></div>
    <div class="side-actions">
      <button class="btn solid block" onclick="newChat()">+ แชทใหม่</button>
    </div>
    <div class="side-label">ประวัติการสนทนา</div>
    <div class="chat-list" id="chatList"></div>
    <div class="side-foot">
      <div class="who">ผู้เชี่ยวชาญ SQL &amp; ฐานข้อมูล</div>
      <button class="btn icon" id="themeBtn" onclick="toggleTheme()" title="สลับธีม">○</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>

  <div class="main">
    <div class="topbar">
      <button class="btn icon menu-btn" onclick="toggleSidebar()" aria-label="เมนู">☰</button>
      <div class="title" id="chatTitle">แชทใหม่</div>
      <span class="source-badge">ตอบจากตำราเท่านั้น</span>
      <div class="fs-group">
        <button class="btn icon" onclick="changeFont(-1)" title="ตัวอักษรเล็กลง" aria-label="ตัวอักษรเล็กลง">A−</button>
        <button class="btn icon" onclick="changeFont(1)" title="ตัวอักษรใหญ่ขึ้น" aria-label="ตัวอักษรใหญ่ขึ้น">A+</button>
      </div>
      <button class="btn icon" onclick="exportChat()" title="ดาวน์โหลดบทสนทนา" aria-label="ดาวน์โหลดบทสนทนา">↓</button>
      <button class="btn icon" onclick="refreshChat()" title="โหลดใหม่">↻</button>
    </div>

    <div class="stream" id="stream"><div class="inner" id="turns"></div></div>
    <button class="btn jump" id="jumpBtn" onclick="follow = true; toBottom(true)" title="ไปข้อความล่าสุด" aria-label="ไปข้อความล่าสุด">↓</button>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="ถามเรื่องฐานข้อมูลหรือ SQL ได้เลย..." autocomplete="off"></textarea>
        <button class="btn solid send" id="sendBtn" onclick="sendMessage()" aria-label="ส่ง">↑</button>
      </div>
      <div class="hint">Enter เพื่อส่ง · Shift+Enter ขึ้นบรรทัดใหม่ · / ไปช่องพิมพ์ · Esc หยุด · ประวัติถูกเก็บไว้ในเบราว์เซอร์นี้</div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const input = document.getElementById("input");
    const turns = document.getElementById("turns");
    const stream = document.getElementById("stream");
    const sendBtn = document.getElementById("sendBtn");
    const KEY = "chsql.v2";

    let state = { activeId: "", chats: {} };
    let busy = false;

    const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(8)))
      .map(b => b.toString(16).padStart(2, "0")).join("");

    /* ================= การเก็บข้อมูล =================
       เบราว์เซอร์เก็บบทสนทนา "เต็ม" ไว้ใน localStorage เป็นหลัก จึงไม่หายเมื่อรีเฟรช
       และยังส่งไปเก็บที่เซิร์ฟเวอร์ (data/web_<id>.json) เมื่อเขียนไฟล์ได้ */
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }
    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(KEY) || "null");
        if (d && d.chats) state = { activeId: d.activeId || "", chats: d.chats };
      } catch (e) {}
    }
    function current() { return state.chats[state.activeId]; }

    function touch(id, history) {
      const first = history.find(m => m.role === "user");
      state.chats[id] = {
        id,
        title: (first ? first.content : "แชทใหม่").slice(0, 60),
        updated: new Date().toISOString(),
        history,
      };
      save();
    }

    /* ================= เรนเดอร์ Markdown + ไฮไลต์ SQL ================= */
    // เรียงคำยาวไว้ก่อนคำสั้น เพื่อให้ regex จับ "INSERT INTO" ก่อน "INTO"
    const SQL_KEYWORDS = ["INSERT INTO","CREATE DATABASE","CREATE TABLE","CREATE VIEW","CREATE INDEX","DROP DATABASE","DROP TABLE","ALTER TABLE","BACKUP DATABASE","TRUNCATE TABLE","FULL OUTER JOIN","LEFT JOIN","RIGHT JOIN","INNER JOIN","OUTER JOIN","GROUP BY","ORDER BY","PRIMARY KEY","FOREIGN KEY","AUTO_INCREMENT","IS NOT NULL","IS NULL","NOT NULL","UNION ALL","SELECT","DISTINCT","VALUES","UPDATE","DELETE","REFERENCES","HAVING","BETWEEN","EXISTS","DEFAULT","UNIQUE","COALESCE","IFNULL","COUNT","UNION","WHERE","LIMIT","CHECK","INDEX","FROM","JOIN","LIKE","CASE","WHEN","THEN","ELSE","DESC","NULL","INTO","TOP","SET","AND","NOT","AVG","SUM","MIN","MAX","ASC","END","ON","AS","OR","IN"];

    const escapeHtml = t => t.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function highlightSql(code) {
      const kw = SQL_KEYWORDS.map(k => k.replace(/ /g, "\\s+")).join("|");
      // สแกนรอบเดียวแล้ว escape ระหว่างทาง จะได้ไม่ไฮไลต์ทับ HTML ที่สร้างไปแล้ว
      const re = new RegExp("(--[^\\n]*)|('[^']*')|\\b(" + kw + ")\\b|\\b(\\d+(?:\\.\\d+)?)\\b", "gi");
      let out = "", last = 0, m;
      while ((m = re.exec(code)) !== null) {
        out += escapeHtml(code.slice(last, m.index));
        const cls = m[1] ? "cmt" : m[2] ? "str" : m[3] ? "kw" : "num";
        out += '<span class="' + cls + '">' + escapeHtml(m[0]) + "</span>";
        last = m.index + m[0].length;
      }
      return out + escapeHtml(code.slice(last));
    }

    function inline(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, '<code class="inline">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/https:\/\/[^\s<>]+/g, url => '<a href="' + url + '" target="_blank" rel="noopener noreferrer">อ่านเอกสารต้นทาง ↗</a>');
    }

    function renderTable(rows) {
      // แถวที่ 2 ของตาราง Markdown เป็นเส้นคั่น (|---|---|) ข้ามไป
      const cells = row => row.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      return '<div class="table-wrap"><table><thead><tr>' +
        head.map(c => "<th>" + inline(c) + "</th>").join("") +
        "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>";
    }

    const CELL_SEP = /\S \| \S/;

    function renderText(text) {
      const lines = text.split("\n");
      let html = "", i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }

        if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { html += "<hr>"; i++; continue; }

        const heading = line.match(/^(#{1,4})\s+(.*)$/);
        if (heading) {
          const level = Math.min(heading[1].length + 2, 6);
          html += `<h${level}>${inline(heading[2])}</h${level}>`;
          i++; continue;
        }

        // แถวตารางจากตำรา: ช่องคั่นด้วย " | " ตั้งแต่สองแถวติดกันขึ้นไป แถวแรกเป็นหัวตาราง
        if (CELL_SEP.test(line) && i + 1 < lines.length && CELL_SEP.test(lines[i + 1])) {
          const rows = [];
          while (i < lines.length && CELL_SEP.test(lines[i])) { rows.push(lines[i].split(" | ").map(c => c.trim())); i++; }
          html += '<div class="table-wrap"><table><thead><tr>' +
            rows[0].map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
            rows.slice(1).map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
            "</tbody></table></div>";
          continue;
        }

        if (line.trim().startsWith("|")) {
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
          html += rows.length >= 2 ? renderTable(rows) : "<p>" + inline(rows.join("\n")) + "</p>";
          continue;
        }

        const bullet = /^\s*[-*+]\s+/, numbered = /^\s*\d+[.)]\s+/;
        if (bullet.test(line) || numbered.test(line)) {
          const ordered = numbered.test(line);
          // คงเลขข้อตามตำรา เช่นรายการที่เริ่มที่ 3) ไม่ให้กลายเป็น 1.
          const start = ordered ? parseInt(line.trim(), 10) : 1;
          const items = [];
          while (i < lines.length && (bullet.test(lines[i]) || numbered.test(lines[i]))) {
            items.push(lines[i].replace(bullet, "").replace(numbered, ""));
            i++;
          }
          const tag = ordered ? "ol" : "ul";
          html += (ordered && start > 1 ? `<ol start="${start}">` : `<${tag}>`) + items.map(t => "<li>" + inline(t) + "</li>").join("") + `</${tag}>`;
          continue;
        }

        const para = [];
        while (i < lines.length && lines[i].trim() &&
               !lines[i].trim().startsWith("|") && !/^#{1,4}\s/.test(lines[i]) &&
               !(CELL_SEP.test(lines[i]) && CELL_SEP.test(lines[i + 1] || "")) &&
               !bullet.test(lines[i]) && !numbered.test(lines[i]) &&
               !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) {
          para.push(lines[i]); i++;
        }
        // ข้อความจากตำราถูกจัดเป็นหนึ่งย่อหน้าต่อบรรทัดแล้ว จึงแยกเป็นคนละย่อหน้า
        html += para.map(p => "<p>" + inline(p) + "</p>").join("");
      }
      return html;
    }

    function renderMarkdown(text) {
      // แยกบล็อกโค้ด ```...``` ออกจากข้อความปกติ แล้วเรนเดอร์คนละแบบ
      return text.split("```").map((part, i) => {
        if (i % 2 === 1) {
          const body = part.replace(/^[a-zA-Z]*\n?/, "").replace(/\n+$/, "");
          return '<div class="code-block">' +
                 '<div class="bar"><span class="lang">SQL</span>' +
                 '<button class="copy" onclick="copyCode(this)">คัดลอก</button></div>' +
                 "<pre><code>" + highlightSql(body) + "</code></pre></div>";
        }
        return renderText(part);
      }).join("");
    }

    function copyCode(btn) {
      const code = btn.closest(".code-block").querySelector("code").innerText;
      navigator.clipboard.writeText(code);
      btn.textContent = "คัดลอกแล้ว";
      setTimeout(() => { btn.textContent = "คัดลอก"; }, 1500);
    }

    /* ================= แสดงผลบทสนทนา ================= */
    function addTurn(text, role) {
      const el = document.createElement("div");
      el.className = "turn " + role;
      if (role === "bot") {
        el.innerHTML = '<div class="who">ครูเอสคิว</div><div class="body"></div>';
        el.querySelector(".body").innerHTML = renderMarkdown(text);
      } else {
        el.innerHTML = '<div class="body"></div>';
        el.querySelector(".body").textContent = text;
      }
      turns.appendChild(el);
      toBottom();
      return el;
    }
    /* เลื่อนตามคำตอบเฉพาะตอนผู้ใช้อยู่ล่างสุด ถ้าเลื่อนขึ้นไปอ่านเอง จะไม่ดึงกลับลงมา */
    let follow = true;
    const nearBottom = () => stream.scrollHeight - stream.scrollTop - stream.clientHeight < 80;
    function toBottom(force) {
      if (!force && !follow) return;
      stream.scrollTo({ top: stream.scrollHeight, behavior: force ? "smooth" : "instant" });
    }
    const userScrolledUp = () => { if (!nearBottom()) follow = false; };
    stream.addEventListener("wheel", e => { if (e.deltaY < 0) follow = false; }, { passive: true });
    stream.addEventListener("touchmove", () => requestAnimationFrame(userScrolledUp), { passive: true });
    stream.addEventListener("scroll", () => {
      if (nearBottom()) follow = true;
      document.getElementById("jumpBtn").classList.toggle("show", !nearBottom());
    }, { passive: true });

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => t.classList.remove("show"), 1600);
    }

    const STARTERS = ["คีย์หลัก (Primary Key) คืออะไร", "ER Diagram คืออะไร", "นอมอลฟอร์มระดับที่ 3 (3NF)",
                      "INNER JOIN กับ LEFT JOIN ต่างกันยังไง", "GROUP BY กับ HAVING ใช้ยังไง", "Big Data คืออะไร"];

    function welcome() {
      const el = addTurn("สวัสดีครับ ผมครูเอสคิว ถามเรื่องฐานข้อมูลและ SQL ได้เลยครับ\n\n" +
        "ผมตอบจากตำรา **การจัดการระบบฐานข้อมูลเพื่องานธุรกิจ** เท่านั้น ถ้าเรื่องไหนตำราไม่มี ผมจะบอกว่าไม่มีข้อมูลครับ", "bot");
      const box = document.createElement("div");
      box.className = "starters";
      STARTERS.forEach(q => {
        const b = document.createElement("button");
        b.className = "starter";
        b.textContent = q;
        b.onclick = () => { input.value = q; grow(); sendMessage(); };
        box.appendChild(b);
      });
      el.querySelector(".body").appendChild(box);
    }

    function paint() {
      turns.innerHTML = "";
      const c = current();
      if (c && c.history.length) {
        let question = "";
        c.history.forEach(m => {
          const el = addTurn(m.content, m.role === "user" ? "user" : "bot");
          if (m.role === "user") { question = m.content; return; }
          markTerms(el.querySelector(".body"), question);
          addTools(el, m.content, null);
        });
      } else {
        welcome();
      }
      document.getElementById("chatTitle").textContent = c && c.history.length ? c.title : "แชทใหม่";
      paintList();
    }

    function timeAgo(iso) {
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (!iso || isNaN(diff)) return "";
      if (diff < 60) return "เมื่อครู่";
      if (diff < 3600) return Math.floor(diff / 60) + " นาทีที่แล้ว";
      if (diff < 86400) return Math.floor(diff / 3600) + " ชั่วโมงที่แล้ว";
      return Math.floor(diff / 86400) + " วันที่แล้ว";
    }

    function paintList() {
      const box = document.getElementById("chatList");
      const items = Object.values(state.chats)
        .filter(c => c.history && c.history.length)
        .sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
      box.innerHTML = "";
      if (!items.length) {
        box.innerHTML = '<div class="side-empty">ยังไม่มีประวัติ<br>เริ่มถามคำถามได้เลยครับ</div>';
        return;
      }
      items.forEach(c => {
        const row = document.createElement("div");
        row.className = "row" + (c.id === state.activeId ? " active" : "");
        row.innerHTML = '<div class="info"><div class="t"></div><div class="m"></div></div>' +
                        '<button class="del" title="ลบแชทนี้">×</button>';
        row.querySelector(".t").textContent = c.title;   // textContent กัน XSS จากหัวข้อแชท
        row.querySelector(".m").textContent = `${c.history.length} ข้อความ · ${timeAgo(c.updated)}`;
        row.querySelector(".info").onclick = () => openChat(c.id);
        row.querySelector(".del").onclick = e => { e.stopPropagation(); removeChat(c.id); };
        box.appendChild(row);
      });
    }

    /* ================= การกระทำ ================= */
    function exportChat() {
      const blob = new Blob([JSON.stringify(current() || {}, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'sql-chat.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function openChat(id) { if (busy) return; state.activeId = id; save(); paint(); toggleSidebar(false); }

    function newChat() {
      if (busy) return;
      state.activeId = newId(); save(); paint(); toggleSidebar(false);
      if (!isTouch) input.focus();
    }

    function removeChat(id) {
      if (busy) return;
      delete state.chats[id];
      fetch("/chats/" + id, { method: "DELETE" }).catch(() => {});
      if (id === state.activeId) state.activeId = newId();
      save(); paint();
    }

    function refreshChat() { if (busy) return; load(); paint(); }

    function toggleSidebar(force) {
      const el = document.getElementById("sidebar");
      const open = force !== undefined ? force : !el.classList.contains("open");
      el.classList.toggle("open", open);
      document.getElementById("scrim").classList.toggle("show", open);
    }

    function toggleTheme() {
      const dark = document.documentElement.getAttribute("data-theme") !== "dark";
      applyTheme(dark);
      try { localStorage.setItem("chsql.theme", dark ? "dark" : "light"); } catch (e) {}
    }
    function applyTheme(dark) {
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      document.getElementById("themeBtn").textContent = dark ? "○" : "●";
      document.querySelector('meta[name="theme-color"]').content = dark ? "#0a0a0a" : "#ffffff";
    }

    /* ================= ช่องพิมพ์ ================= */
    function grow() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 180) + "px";
    }
    input.addEventListener("input", grow);
    const isTouch = matchMedia("(hover: none)").matches;
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey && !isTouch) { e.preventDefault(); sendMessage(); }
    });

    let controller = null;   // ใช้กดหยุดกลางคัน

    function setBusy(on) {
      busy = on;
      sendBtn.textContent = on ? "■" : "↑";
      sendBtn.title = on ? "หยุด" : "ส่ง";
    }

    function addTools(el, text, onRetry) {
      const box = document.createElement("div");
      box.className = "turn-tools";
      const copy = document.createElement("button");
      copy.className = "tool"; copy.textContent = "คัดลอก";
      copy.onclick = () => {
        navigator.clipboard.writeText(text).then(() => toast("คัดลอกคำตอบแล้ว"), () => toast("คัดลอกไม่สำเร็จ"));
      };
      box.appendChild(copy);
      if ("speechSynthesis" in window) {
        const listen = document.createElement("button");
        listen.className = "tool"; listen.textContent = "ฟัง";
        listen.onclick = () => speak(text, listen);
        box.appendChild(listen);
      }
      // เวลาอ่านโดยประมาณ (ภาษาไทยราว 700 ตัวอักษรต่อนาที) แสดงเฉพาะคำตอบยาว
      const plain = speechText(text);
      if (plain.length > 600) {
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = "อ่านราว " + Math.max(1, Math.round(plain.length / 700)) + " นาที";
        box.appendChild(meta);
      }
      if (onRetry) {
        const again = document.createElement("button");
        again.className = "tool"; again.textContent = "ถามใหม่";
        again.onclick = onRetry;
        box.appendChild(again);
      }
      el.appendChild(box);
    }

    /* คำตอบมาจากเซิร์ฟเวอร์ทีเดียวทั้งก้อน ค่อย ๆ แสดงทีละช่วงให้เหมือนกำลังพิมพ์
       ความเร็วคิดตามเวลาจริง: อย่างน้อย 40 ตัวอักษร/วินาที และคำตอบยาวพิมพ์จบในราว 8 วินาที
       กดข้าม, คลิกที่คำตอบ, กด Esc หรือปุ่มหยุด แล้วขึ้นครบทันที */
    const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
    // สระบน/ล่างและวรรณยุกต์ไทย ห้ามตัดก่อนตัวพวกนี้ ไม่งั้นจะเห็นสระลอยชั่วขณะ
    const THAI_MARK = /[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/;
    let skipTyping = null;

    function typeOut(el, body, full, signal) {
      if (REDUCED_MOTION || full.length < 40) {
        body.innerHTML = renderMarkdown(full);
        toBottom();
        return Promise.resolve();
      }
      const bar = document.createElement("div");
      bar.className = "typebar";
      bar.innerHTML = '<div class="track"><div class="fill"></div></div><button class="tool">ข้าม ›</button>';
      el.appendChild(bar);
      el.classList.add("typing-now");
      const fill = bar.querySelector(".fill");
      const cps = Math.max(40, full.length / 8);
      let shown = 0, last = null, skip = false;
      skipTyping = () => { skip = true; };
      bar.querySelector("button").onclick = skipTyping;
      body.onclick = skipTyping;

      return new Promise(resolve => {
        const frame = ts => {
          if (last !== null) shown += (ts - last) / 1000 * cps;
          last = ts;
          if (skip || signal.aborted) shown = full.length;
          let n = Math.min(full.length, Math.floor(shown));
          while (n < full.length && THAI_MARK.test(full[n])) n++;
          shown = Math.max(shown, n);
          const done = n >= full.length;
          body.innerHTML = renderMarkdown(full.slice(0, n)) + (done ? "" : '<span class="caret"></span>');
          fill.style.width = (100 * n / full.length) + "%";
          toBottom();
          if (!done) { requestAnimationFrame(frame); return; }
          bar.remove();
          el.classList.remove("typing-now");
          body.onclick = null;
          skipTyping = null;
          resolve();
        };
        requestAnimationFrame(frame);
      });
    }

    /* ไฮไลต์คำจากคำถามในคำตอบ (ไม่แตะบล็อกโค้ดและหัวข้อ) */
    const ASK_NOISE = /คืออะไร|อะไรบ้าง|อะไร|ยังไงบ้าง|ยังไง|อย่างไร|ต่างกัน|ตรงไหน|ใช้ยังไง|ช่วย|อธิบาย|หน่อย|ครับ|ค่ะ|คะ|ไหม|และ|หรือ|กับ|ของ|ที่|การ/g;
    const ASK_STOP = new Set(["sql", "the", "what", "how", "is", "and", "or", "of", "in", "to"]);

    function markTerms(body, question) {
      if (!body || !question) return;
      const terms = new Set();
      (question.match(/[A-Za-z][A-Za-z0-9_]*(?:\s+[A-Za-z][A-Za-z0-9_]*)*/g) || []).forEach(phrase => {
        if (!ASK_STOP.has(phrase.toLowerCase()) && phrase.length >= 2) terms.add(phrase);
      });
      (question.replace(/[A-Za-z0-9_()\[\]?.,:;!"'\/-]+/g, " ").replace(ASK_NOISE, " ").match(/[\u0E00-\u0E7F]{3,}/g) || [])
        .forEach(w => terms.add(w));
      if (!terms.size) return;
      const esc = [...terms].sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^$()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+"));
      const re = new RegExp(esc.join("|"), "gi");
      const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
        acceptNode: n => n.parentElement.closest("pre, code, h3, h4, h5, h6, .turn-tools") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
      });
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        const text = node.nodeValue;
        re.lastIndex = 0;
        if (!re.test(text)) return;
        re.lastIndex = 0;
        const frag = document.createDocumentFragment();
        let last = 0, m;
        while ((m = re.exec(text)) !== null) {
          if (!m[0]) { re.lastIndex++; continue; }
          frag.appendChild(document.createTextNode(text.slice(last, m.index)));
          const mark = document.createElement("mark");
          mark.className = "hit"; mark.textContent = m[0];
          frag.appendChild(mark);
          last = m.index + m[0].length;
        }
        frag.appendChild(document.createTextNode(text.slice(last)));
        node.replaceWith(frag);
      });
    }

    /* อ่านออกเสียงภาษาไทย: ข้ามโค้ด SQL และตัดเป็นช่วงสั้น ๆ เพราะเบราว์เซอร์บางตัวหยุดอ่านข้อความยาว */
    function speechText(text) {
      return text
        .replace(/```[\s\S]*?```/g, "\n(ตัวอย่างคำสั่ง SQL)\n")
        .replace(/^แหล่งข้อมูล:.*$/gm, "")
        .replace(/^#+\s*/gm, "")
        .replace(/^\s*[-*]{3,}\s*$/gm, "")
        .replace(/ \| /g, ", ")
        .replace(/\*\*/g, "")
        .replace(/\n{2,}/g, "\n").trim();
    }
    let speakingBtn = null;
    function speak(text, btn) {
      const synth = window.speechSynthesis;
      const again = speakingBtn === btn;
      synth.cancel();
      if (speakingBtn) { speakingBtn.textContent = "ฟัง"; speakingBtn.classList.remove("on"); speakingBtn = null; }
      if (again) return;   // กดซ้ำที่ปุ่มเดิม = หยุด
      const chunks = speechText(text).split(/\n|(?<=[.!?])\s+/).map(t => t.trim()).filter(Boolean);
      if (!chunks.length) return;
      const voice = synth.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("th"));
      if (!voice) toast("เครื่องนี้อาจไม่มีเสียงภาษาไทย");
      speakingBtn = btn; btn.textContent = "หยุดฟัง"; btn.classList.add("on");
      chunks.forEach((chunk, i) => {
        const u = new SpeechSynthesisUtterance(chunk);
        u.lang = "th-TH"; if (voice) u.voice = voice;
        if (i === chunks.length - 1) u.onend = () => {
          if (speakingBtn === btn) { btn.textContent = "ฟัง"; btn.classList.remove("on"); speakingBtn = null; }
        };
        synth.speak(u);
      });
    }

    /* ขนาดตัวอักษร */
    const FONT_SIZES = [13, 14, 15, 16, 17, 18, 20];
    let fontIndex = 2;
    function applyFont() { turns.style.setProperty("--fs", FONT_SIZES[fontIndex] + "px"); }
    function changeFont(delta) {
      fontIndex = Math.max(0, Math.min(FONT_SIZES.length - 1, fontIndex + delta));
      applyFont();
      try { localStorage.setItem("chsql.font", String(fontIndex)); } catch (e) {}
      toast("ขนาดตัวอักษร " + FONT_SIZES[fontIndex] + "px");
    }

    async function ask(text, replaceLast) {
      if (busy) return;
      const id = state.activeId;
      const c = current();
      let history = c && c.history ? c.history.slice() : [];
      if (replaceLast) history = history.slice(0, -2);   // ถามใหม่: ตัดคู่ถาม-ตอบเดิมออก
      if (!history.length) turns.innerHTML = "";

      follow = true;
      if (!replaceLast) addTurn(text, "user");

      const el = document.createElement("div");
      el.className = "turn bot";
      el.innerHTML = '<div class="who">ครูเอสคิว</div><div class="typing" role="status" aria-live="polite"><span class="search-label">กำลังค้นหาชุดข้อมูล…</span><i></i><i></i><i></i></div>';
      turns.appendChild(el); toBottom();

      setBusy(true);
      controller = new AbortController();
      let reply = "", stopped = false;

      try {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: history.slice(-30), chat_id: id }),
          signal: controller.signal,
        });
        if (!res.ok || !res.body) throw new Error("bad response");

        const reader = res.body.getReader();
        const decoder = new TextDecoder();   // stream:true กัน UTF-8 ไทยขาดกลางตัวอักษร
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          reply += decoder.decode(value, { stream: true });
        }
        reply += decoder.decode();

        const body = document.createElement("div");
        body.className = "body";
        el.querySelector(".typing").replaceWith(body);
        await typeOut(el, body, reply, controller.signal);
        markTerms(body, text);
      } catch (err) {
        stopped = err && err.name === "AbortError";
        if (!reply) {
          reply = stopped ? "(หยุดแล้ว)" : "เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จครับ ลองใหม่อีกครั้งนะครับ";
          const body = document.createElement("div");
          body.className = "body";
          body.innerHTML = renderMarkdown(reply);
          const t = el.querySelector(".typing");
          if (t) t.replaceWith(body); else el.appendChild(body);
        } else {
          el.querySelector(".body").innerHTML = renderMarkdown(reply);
        }
      } finally {
        controller = null;
        setBusy(false);
      }

      addTools(el, reply, null);
      history.push({ role: "user", content: text });
      history.push({ role: "assistant", content: reply });
      touch(id, history);
      document.getElementById("chatTitle").textContent = state.chats[id].title;
      paintList();
      if (!isTouch) input.focus();
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        if (skipTyping) skipTyping();
        else if (busy && controller) controller.abort();
        return;
      }
      const typingInField = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if (e.key === "/" && !typingInField) { e.preventDefault(); input.focus(); }
    });

    function sendMessage() {
      if (busy) { if (controller) controller.abort(); return; }   // กดซ้ำ = หยุด
      const text = input.value.trim();
      if (!text) return;
      input.value = ""; grow();
      ask(text, false);
    }

    /* ================= เริ่มทำงาน ================= */
    (function start() {
      let saved = null;
      try { saved = localStorage.getItem("chsql.theme"); } catch (e) {}
      applyTheme(saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);

      try {
        const f = parseInt(localStorage.getItem("chsql.font"), 10);
        if (f >= 0 && f < FONT_SIZES.length) fontIndex = f;
      } catch (e) {}
      applyFont();

      load();
      if (!state.activeId) state.activeId = newId();
      paint();
      save();
    })();
  </script>
</body>
</html>
