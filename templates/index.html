<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เพื่อนสนิทของคุณ</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: linear-gradient(135deg, #fce4ec, #f8bbd0); display: flex; justify-content: center; align-items: center; height: 100vh; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .modal { background: white; border-radius: 20px; padding: 32px 28px; width: 320px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
    .modal h2 { color: #e91e63; margin-bottom: 8px; font-size: 20px; }
    .modal p { color: #888; font-size: 14px; margin-bottom: 20px; }
    .modal input { width: 100%; padding: 10px 16px; border: 1.5px solid #f48fb1; border-radius: 24px; font-size: 15px; outline: none; font-family: 'Sarabun', sans-serif; margin-bottom: 14px; }
    .modal input:focus { border-color: #e91e63; }
    .modal button { background: linear-gradient(135deg, #e91e63, #f06292); color: white; border: none; padding: 10px 28px; border-radius: 24px; font-size: 15px; cursor: pointer; width: 100%; }

    .chat-container { width: 420px; height: 620px; background: white; border-radius: 24px; box-shadow: 0 8px 32px rgba(233,30,99,0.15); display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: linear-gradient(135deg, #e91e63, #f06292); color: white; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    .avatar { width: 44px; height: 44px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .header-info .name { font-size: 17px; font-weight: bold; }
    .header-info .status { font-size: 12px; opacity: 0.85; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #fff9fb; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 18px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
    .message.user { background: #e91e63; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message.bot { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .typing { color: #f48fb1; font-size: 13px; font-style: italic; }
    .chat-input { display: flex; padding: 12px 14px; border-top: 1px solid #fce4ec; gap: 8px; background: white; }
    .chat-input input { flex: 1; padding: 10px 16px; border: 1.5px solid #f48fb1; border-radius: 24px; outline: none; font-size: 14px; font-family: 'Sarabun', sans-serif; }
    .chat-input input:focus { border-color: #e91e63; }
    .chat-input button { background: linear-gradient(135deg, #e91e63, #f06292); color: white; border: none; padding: 10px 18px; border-radius: 24px; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>

  <div class="modal-overlay" id="nameModal">
    <div class="modal">
      <h2>🌸 สวัสดีค่า!</h2>
      <p>ขอรู้จักหน่อยนะคะ เธอชื่ออะไรคะ?</p>
      <input type="text" id="nameInput" placeholder="ชื่อของคุณ..." maxlength="30">
      <button onclick="submitName()">เริ่มคุยกันเลย 💕</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🌸</div>
      <div class="header-info">
        <div class="name" id="botChatName">เพื่อนสนิท</div>
        <div class="status">พร้อมรับฟังเสมอนะคะ 💕</div>
      </div>
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input">
      <input type="text" id="input" placeholder="พิมพ์ข้อความ..." autocomplete="off">
      <button onclick="sendMessage()">ส่ง</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
    document.getElementById("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") submitName(); });

    async function submitName() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name) return;
      await fetch("/set_name", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      document.getElementById("nameModal").style.display = "none";
      document.getElementById("botChatName").textContent = `เพื่อนของ${name}`;
      addMessage(`สวัสดีค่า ${name} 🌸 ยินดีที่ได้รู้จักนะคะ มีอะไรอยากคุยหรือปรึกษาบอกได้เลยนะ 💕`, "bot");
    }

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `message ${sender}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";

      const typing = document.createElement("div");
      typing.className = "message bot typing";
      typing.textContent = "กำลังพิมพ์...";
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      messages.removeChild(typing);
      addMessage(data.reply || data.error, "bot");
    }
  </script>
</body>
</html>
